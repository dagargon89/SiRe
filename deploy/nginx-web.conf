# SiRe SPA (React) — Nginx sirviendo el build estático de apps/web/dist.
server {
    listen 80;
    server_name sire.example.org;

    root /var/www/sire/apps/web/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA: todas las rutas resuelven a index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para assets con hash; index.html sin cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
