# SiRe API (CodeIgniter 4) — Nginx + PHP-FPM
# Sirve solo apps/api/public; el resto del proyecto queda fuera del webroot.
server {
    listen 80;
    server_name api.sire.example.org;

    root /var/www/sire/apps/api/public;
    index index.php;

    # Cabeceras de seguridad base (además de las de la app).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 12M;   # facturas hasta ~10 MB

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Nunca servir el .env ni archivos ocultos.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
